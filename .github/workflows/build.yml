name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install cmake icu4c
      - name: Configure on Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure on macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix icu4c)"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Offline integration test
        run: ctest --test-dir build --output-on-failure
      - name: Install and test installed compiler
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/icicle-install"
          python3 tests/test_local.py "$RUNNER_TEMP/icicle-install/bin/icicle"
